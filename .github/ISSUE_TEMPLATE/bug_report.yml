name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't post account credentials, API tokens or links to copyrighted content.
        Security issues: see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the Web UI topbar or `GET /api/v1/version`
      placeholder: v0.6.0
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Docker Compose, Binary, From source]
    validations:
      required: true
  - type: input
    id: hoster
    attributes:
      label: Hoster / link source (if relevant)
      placeholder: e.g. Real-Debrid, Click'n'Load from a link protector
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs hopperd` or hopperd's output — remove tokens/passwords."
      render: shell
