<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hopper</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      width: 280px;
      background: #0b0d10;
      color: #d5dae0;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      padding: 14px 16px 16px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .wordmark {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #f2f4f6;
    }

    #version {
      font-size: 11px;
      color: #7c8590;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #14171b;
      border: 1px solid #262b31;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-on {
      background: #3ecf7e;
      box-shadow: 0 0 4px rgba(62, 207, 126, 0.6);
    }

    .dot-off {
      background: #7c8590;
    }

    #status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #last-cnl {
      padding: 8px 10px;
      color: #9aa3ad;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    button {
      background: #4da3ff;
      color: #0b0d10;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    button:hover {
      background: #6cb4ff;
    }

    button.secondary {
      background: #14171b;
      color: #d5dae0;
      border: 1px solid #262b31;
    }

    button.secondary:hover {
      background: #1b1f25;
      border-color: #4da3ff;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="wordmark">HOPPER</span>
      <span id="version"></span>
    </header>

    <div class="row">
      <span id="status-dot" class="dot dot-off"></span>
      <span id="status-text">Checking&hellip;</span>
    </div>

    <div id="last-cnl">No recent imports</div>

    <div class="actions">
      <button id="open-ui" type="button">Open Hopper UI &rarr;</button>
      <button id="open-options" type="button" class="secondary">Options &rarr;</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
